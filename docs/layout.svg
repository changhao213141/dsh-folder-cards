<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" width="780" height="440" role="img" aria-label="Layout diagram: folder cards on the left, the opened folder's session list on the right">
  <rect width="780" height="440" fill="#f6f7f9"/>
  <text x="24" y="34" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#1f2733">布局示意 · layout diagram</text>
  <text x="24" y="54" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" fill="#6b7684">不是运行截图 / not a screenshot</text>

  <!-- sidebar -->
  <rect x="24" y="76" width="212" height="332" rx="14" fill="#ffffff" stroke="#d8dde4"/>
  <rect x="40" y="92" width="86" height="10" rx="5" fill="#c7ced8"/>
  <rect x="40" y="110" width="180" height="24" rx="7" fill="#eef1f5"/>
  <circle cx="52" cy="122" r="3" fill="#8a95a3"/>
  <rect x="62" y="119" width="52" height="6" rx="3" fill="#b6bfca"/>

  <text x="40" y="156" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" font-weight="600" fill="#6b7684">工作区</text>
  <circle cx="196" cy="152" r="3.4" fill="none" stroke="#8a95a3" stroke-width="1.3"/>
  <path d="M200 156l4 4" stroke="#8a95a3" stroke-width="1.3" stroke-linecap="round"/>

  <g>
    <!-- 2 x 3 card grid, 3:4 portrait -->
    <g>
      <rect x="40" y="168" width="86" height="115" rx="12" fill="#f3f6fa" stroke="#d8dde4"/>
      <path d="M66 204h8l3 3h17v20H66z" fill="none" stroke="#7d8b9b" stroke-width="1.6" stroke-linejoin="round"/>
      <rect x="60" y="262" width="46" height="6" rx="3" fill="#b6bfca"/>
    </g>
    <g>
      <rect x="134" y="168" width="86" height="115" rx="12" fill="#f3f6fa" stroke="#d8dde4"/>
      <path d="M160 204h8l3 3h17v20H160z" fill="none" stroke="#7d8b9b" stroke-width="1.6" stroke-linejoin="round"/>
      <rect x="154" y="262" width="46" height="6" rx="3" fill="#b6bfca"/>
    </g>
    <g>
      <rect x="40" y="291" width="86" height="115" rx="12" fill="#eef3fb" stroke="#9fb6d8"/>
      <path d="M66 327h8l3 3h17v20H66z" fill="none" stroke="#4b6f9e" stroke-width="1.6" stroke-linejoin="round"/>
      <rect x="60" y="385" width="46" height="6" rx="3" fill="#9db3cd"/>
      <circle cx="52" cy="303" r="4" fill="none" stroke="#4b6f9e" stroke-width="1.4"/>
    </g>
    <g>
      <rect x="134" y="291" width="86" height="115" rx="12" fill="#f3f6fa" stroke="#d8dde4"/>
      <path d="M160 327h8l3 3h17v20H160z" fill="none" stroke="#7d8b9b" stroke-width="1.6" stroke-linejoin="round"/>
      <rect x="154" y="385" width="46" height="6" rx="3" fill="#b6bfca"/>
    </g>
  </g>

  <!-- thumb -->
  <rect x="226" y="176" width="5" height="70" rx="2.5" fill="#b6bfca"/>
  <text x="24" y="426" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" fill="#6b7684">卡片：两列 3:4，悬停浮现滑块</text>

  <!-- arrow -->
  <path d="M252 240h44" stroke="#8a95a3" stroke-width="1.4" stroke-dasharray="4 4"/>
  <path d="M292 235l7 5-7 5" fill="none" stroke="#8a95a3" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="250" y="224" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="10" fill="#6b7684">点击 / 水波</text>

  <!-- opened folder panel -->
  <rect x="308" y="76" width="448" height="332" rx="14" fill="#ffffff" stroke="#d8dde4"/>
  <rect x="324" y="92" width="64" height="24" rx="7" fill="#eef3fb" stroke="#9fb6d8"/>
  <text x="336" y="108" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" fill="#3d5f8c">‹ 返回</text>
  <text x="400" y="108" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#1f2733">personal-website</text>

  <rect x="324" y="128" width="416" height="30" rx="8" fill="#eef3fb"/>
  <text x="336" y="147" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" fill="#3d5f8c">＋ 新会话</text>

  <g font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" fill="#3a4552">
    <rect x="324" y="164" width="416" height="30" rx="8" fill="#f6f7f9"/>
    <circle cx="340" cy="179" r="3" fill="#4b6f9e"/>
    <text x="352" y="183">首页改版：导航与首屏</text>
    <text x="700" y="183" text-anchor="end" fill="#8a95a3">8 分钟</text>

    <rect x="324" y="196" width="416" height="30" rx="8" fill="none"/>
    <circle cx="340" cy="211" r="3" fill="#c7ced8"/>
    <text x="352" y="215">加载页动效时序</text>
    <text x="700" y="215" text-anchor="end" fill="#8a95a3">2 天</text>

    <rect x="324" y="228" width="416" height="30" rx="8" fill="none"/>
    <circle cx="340" cy="243" r="3" fill="#c7ced8"/>
    <text x="352" y="247">配色与暗色主题对照</text>
    <text x="700" y="247" text-anchor="end" fill="#8a95a3">5 天</text>

    <text x="336" y="288" fill="#8a95a3">已归档 2 个</text>
  </g>

  <rect x="324" y="296" width="416" height="1" fill="#e6eaef"/>

  <text x="324" y="330" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="10" fill="#8a95a3">会话行：右键或行尾「⋯」打开原生菜单（重命名 / 置顶 / 分叉 / 归档）</text>
  <text x="324" y="352" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="10" fill="#8a95a3">返回：水波从指针处收拢，卡片网格淡入</text>
  <text x="324" y="374" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="10" fill="#8a95a3">搜索：标题 → 会话标题 → 正文命中</text>
</svg>
