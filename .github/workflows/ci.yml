name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild the bundle
        run: node build.mjs
      - name: The committed bundle must match src/
        run: git diff --exit-code -- client.js
      - name: Smoke checks
        run: node test/smoke.mjs
